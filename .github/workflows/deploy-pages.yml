name: Publicar en GitHub Pages

on:
  push:
    branches:
      - master
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Validar y preparar sitio
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validar estructura y recursos
        run: node scripts/validate.mjs

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar archivos públicos
        shell: bash
        run: |
          mkdir -p _site
          cp index.html 404.html robots.txt sitemap.xml manifest.webmanifest .nojekyll _site/
          cp -R assets css fonts js _site/

      - name: Subir sitio preparado
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Desplegar
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
